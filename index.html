<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Adam Jaffe Back</title>
    <link rel="shortcut icon" href="/favicon.ico">

    <!-- Bootstrap -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/3.4.1/css/bootstrap.min.css" rel="stylesheet">

    <link href="stylesheet.css" rel="stylesheet">
  </head>
  <body>
    <div class="container">
      <div class="constellations">
        <a href="/about.html" class="const-link" id="link-about">
          <div class="const" id="AB">
            <div class="lines" id="AB">
              <p>About Me</p>
            </div>
          </div>
        </a>
        <a href="https://www.linkedin.com/in/adamjaffeback/" target="_blank" class="const-link" id="link-linkedin">
          <div class="const" id="linkedin">
            <div class="lines" id="linkedin">
              <p>Linkedin</p>
            </div>
          </div>
        </a>
        <a href="https://github.com/adamjaffeback" target="_blank" class="const-link" id="link-github">
          <div class="const" id="github">
            <div class="lines" id="github">
              <p>GitHub</p>
            </div>
          </div>
        </a>
        <a href="http://adam-back.azurewebsites.net/" target="_blank" class="const-link" id="link-blog">
          <div class="const" id="blog">
            <div class="lines" id="blog">
              <p>Tech Blog</p>
            </div>
          </div>
        </a>
        <a href="/travel.html" class="const-link" id="link-travel">
          <div class="const" id="travel">
            <div class="lines" id="travel">
              <p>Travel</p>
            </div>
          </div>
        </a>
      </div>
    </div>

    <div class="hint-badge" id="hint-badge">Move your mouse around to discover constellations</div>

    <!-- jQuery (necessary for Bootstrap's JavaScript plugins) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <!-- Include all compiled plugins (below), or include individual files as needed -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <script src='mobile.js'></script>
    <script>
      $('#hint-badge').hover(
        function () { $('body').addClass('illuminate'); },
        function () { $('body').removeClass('illuminate'); }
      );
    </script>
  </body>
</html>
